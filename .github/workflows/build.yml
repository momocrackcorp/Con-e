name: Compilar Con-E
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar
        run: dotnet build src/Con-E.csproj -c Release -o output
      - name: Preparar dependencias y licencias de sensores
        shell: pwsh
        run: |
          ./build-sensor-dependencies.ps1
      - name: Comprobar interfaz con datos simulados
        shell: pwsh
        run: |
          $p = Start-Process output/Con-E.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'La prueba de interfaz excedió 120 segundos' }
          if ($p.ExitCode -ne 0) { Get-Content output/qa/error.txt -ErrorAction SilentlyContinue; throw 'Falló la prueba de interfaz' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Con-E-interfaz-pruebas
          path: output/qa/
          if-no-files-found: error
      - name: Preparar USB
        shell: pwsh
        run: |
          Remove-Item output/qa -Recurse -Force
          Copy-Item README.md output/
          Copy-Item Shared/LICENSE output/Licenses/StorageShared-MIT.txt
          Copy-Item Shared/README.md output/Licenses/StorageArtwork.txt
          Copy-Item Shared/MODEL_SOURCES.md output/Licenses/StorageDetectionSources.md
          New-Item output/Tools -ItemType Directory -Force
          Copy-Item Tools/LEEME.txt output/Tools/
      - uses: actions/upload-artifact@v4
        with:
          name: Con-E-v0.16.3-portable
          path: output/
          if-no-files-found: error

      - name: Generar icono WinPart
        shell: pwsh
        run: ./WinPart/build-icon.ps1
      - name: Compilar WinPart independiente
        run: dotnet build WinPart/src/WinPart.csproj -c Release -o partition-output
      - name: Probar interfaz independiente WinPart
        shell: pwsh
        run: |
          $p = Start-Process partition-output/WinPart.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'WinPart excedió plazo' }
          if ($p.ExitCode -ne 0) { Get-Content partition-output/qa/error.txt -ErrorAction SilentlyContinue; throw 'Falló WinPart' }
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('partition-output/qa/**') != ''
        with:
          name: WinPart-interfaz-pruebas
          path: partition-output/qa/
          if-no-files-found: error
      - name: Probar reducción y ampliación sobre VHD desechable
        shell: pwsh
        run: |
          $image = Join-Path $env:RUNNER_TEMP 'cone-test.vhd'
          $script = Join-Path $env:RUNNER_TEMP 'cone-vhd.txt'
          @("create vdisk file=`"$image`" maximum=256 type=expandable", "select vdisk file=`"$image`"", 'attach vdisk') | Set-Content $script
          try {
            diskpart /s $script
            $disk = Get-DiskImage -ImagePath $image | Get-Disk
            $disk | Initialize-Disk -PartitionStyle GPT
            $part = New-Partition -DiskNumber $disk.Number -Size 180MB -AssignDriveLetter
            $part | Format-Volume -FileSystem NTFS -NewFileSystemLabel 'CONE_TEST' -Confirm:$false | Out-Null
            $env:CONE_TEST_DISK_NUMBER = [string]$disk.Number
            $env:CONE_TEST_DISK_ID = (Get-Disk -Number $disk.Number).UniqueId
            $p = Start-Process partition-output/WinPart.exe -ArgumentList '--resize-test' -PassThru
            if (-not $p.WaitForExit(360000)) { $p.Kill(); throw 'Prueba VHD excedió plazo' }
            if ($p.ExitCode -ne 0) { Get-Content partition-output/qa/resize-error.txt -ErrorAction SilentlyContinue; throw 'Falló prueba de redimensionamiento' }
          } finally {
            Dismount-DiskImage -ImagePath $image -ErrorAction SilentlyContinue
            Remove-Item $image -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WinPart-pruebas
          path: partition-output/qa/
          if-no-files-found: error
      - name: Preparar WinPart portátil
        shell: pwsh
        run: |
          Remove-Item partition-output/qa -Recurse -Force
          Copy-Item WinPart/README.md partition-output/README.md
          Copy-Item WinPart/COPYING partition-output/COPYING
          Copy-Item WinPart/THIRD_PARTY_NOTICES.md partition-output/THIRD_PARTY_NOTICES.md
          New-Item partition-output/source/WinPart/src -ItemType Directory -Force
          Copy-Item WinPart/src/*.cs partition-output/source/WinPart/src/
          Copy-Item WinPart/src/*.csproj partition-output/source/WinPart/src/
          Copy-Item WinPart/src/app.ico partition-output/source/WinPart/src/
          Copy-Item WinPart/build-icon.ps1 partition-output/source/WinPart/
          Copy-Item WinPart/README.md partition-output/source/WinPart/
          Copy-Item WinPart/COPYING partition-output/source/WinPart/
          Copy-Item WinPart/THIRD_PARTY_NOTICES.md partition-output/source/WinPart/
          New-Item partition-output/source/Shared -ItemType Directory -Force
          Copy-Item Shared/* partition-output/source/Shared/
          Copy-Item WinPart/upstream partition-output/source/WinPart/upstream -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: WinPart-v0.9.2-portable
          path: partition-output/
          if-no-files-found: error
