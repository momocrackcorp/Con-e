name: Compilar Con-E
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar
        run: dotnet build src/Con-E.csproj -c Release -o output
      - name: Comprobar interfaz con datos simulados
        shell: pwsh
        run: |
          $p = Start-Process output/Con-E.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'La prueba de interfaz excedió 60 segundos' }
          if ($p.ExitCode -ne 0) { throw 'Falló la prueba de interfaz' }
      - uses: actions/upload-artifact@v4
        with:
          name: Con-E-interfaz-pruebas
          path: output/qa/
          if-no-files-found: error
      - name: Preparar USB
        shell: pwsh
        run: |
          Remove-Item output/qa -Recurse -Force
          Copy-Item README.md output/
          New-Item output/Tools -ItemType Directory -Force
          Copy-Item Tools/LEEME.txt output/Tools/
      - uses: actions/upload-artifact@v4
        with:
          name: Con-E-v0.5.0-portable
          path: output/
          if-no-files-found: error
