name: Incorporar ilustración original Con-E
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-cone-art.yml']
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar conversión de formato
        run: python -m pip install Pillow
      - name: Transferir imagen original y guardar recurso
        shell: python
        run: |
          import base64,json,os,pathlib,subprocess,sys,tempfile
          from PIL import Image
          root=pathlib.Path(tempfile.mkdtemp(prefix='cone-original-',dir=os.environ['RUNNER_TEMP']))
          root.chmod(0o700)
          helpers=root/'helpers';helpers.mkdir(mode=0o700)
          (helpers/"library_file_transfer.py").write_bytes(base64.b64decode(""))
          (helpers/"library_hosted_apps.py").write_bytes(base64.b64decode(""))
          transfer=json.loads(base64.b64decode(""))
          print('::add-mask::'+transfer['download_url'])
          print('::add-mask::'+transfer['completion_token'])
          source=root/'Char_cone.webp'
          subprocess.run([sys.executable,str(helpers/'library_file_transfer.py'),'materialize',str(source)],input=json.dumps(transfer),text=True,check=True)
          image=Image.open(source).convert('RGBA')
          assert image.width>=100 and image.height>=200, 'Imagen incorrecta'
          png=root/'Char_cone.png';image.save(png,'PNG')
          repo=os.environ['GH_REPO']
          for filename,path in [('Char_cone.webp',source),('Char_cone.png',png)]:
              body={'message':'Add user-provided Coné illustration for About dialog','content':base64.b64encode(path.read_bytes()).decode(),'branch':'main'}
              result=subprocess.run(['gh','api','--method','PUT','repos/'+repo+'/contents/src/Resources/'+filename,'--input','-'],input=json.dumps(body),text=True,capture_output=True)
              if result.returncode: raise RuntimeError('No se pudo guardar el recurso: '+result.stderr)
              print('Recurso guardado: '+filename)
          print('Ilustración original transferida; PNG conserva el dibujo completo.')
