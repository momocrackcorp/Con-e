name: Con-E Linux · prueba Ubuntu y Mint
on:
  push:
    branches: [main]
    paths: ['Linux/**', '.github/workflows/linux.yml', 'Shared/*.png', 'src/Resources/Char_cone.png']
  pull_request:
    paths: ['Linux/**', '.github/workflows/linux.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de compilación y prueba
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv python3-tk libgl1 libegl1 libdbus-1-3 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 pciutils usbutils
          python3 -m venv Linux/.venv
          Linux/.venv/bin/pip install -r Linux/requirements.txt pyinstaller==6.12.0
      - name: Preparar recursos locales
        run: |
          mkdir -p Linux/assets
          cp Shared/disk-miniatures.png Shared/usb-miniature.png src/Resources/Char_cone.png Linux/assets/
      - name: Pruebas de inventario y análisis
        working-directory: Linux
        run: |
          .venv/bin/python -m unittest -v test_backend
          .venv/bin/python -c "import backend; s=backend.collect(); assert s['cpu'] and s['memory']['total']>0; print('Inventario real: CPU/RAM leídos; discos=',len(s['disks']))"
          CONE_QA_DIR=qa .venv/bin/python app.py --smoke-test
      - name: Empaquetar ejecutable
        working-directory: Linux
        run: |
          .venv/bin/pyinstaller --noconfirm --clean --onedir --name Con-E-Linux --add-data 'assets:assets' --copy-metadata PySide6 --copy-metadata psutil app.py
          CONE_QA_DIR=qa-packaged dist/Con-E-Linux/Con-E-Linux --smoke-test
          .venv/bin/python build_package.py
          dpkg-deb --info release/con-e-linux_0.1.0_amd64.deb
      - name: Probar binario en Ubuntu 24.04
        run: |
          docker run --rm -v "$PWD/Linux/dist/Con-E-Linux:/app:ro" -v "$PWD/Linux/qa-ubuntu24:/qa" ubuntu:24.04 bash -c 'set -e; apt-get update -qq; DEBIAN_FRONTEND=noninteractive apt-get install -y libgl1 libegl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1; QT_QPA_PLATFORM=offscreen CONE_QA_DIR=/qa /app/Con-E-Linux --smoke-test'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Con-E-Linux-interfaz-pruebas
          path: |
            Linux/qa/
            Linux/qa-packaged/
            Linux/qa-ubuntu24/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Con-E-Linux-v0.1.0-prueba
          path: Linux/release/
          if-no-files-found: error
  publish:
    needs: linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[linux-preview]')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Con-E-Linux-v0.1.0-prueba
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Con-E-Linux-interfaz-pruebas
          path: qa
      - name: Publicar versión de prueba Linux
        run: |
          gh release create con-e-linux-v0.1.0 release/* --target "$GITHUB_SHA" --title 'Con-E Linux v0.1.0 · prueba Ubuntu/Mint' --notes-file Linux/RELEASE_NOTES.md --prerelease --latest=false
      - name: Guardar capturas de ejemplo
        shell: python3 {0}
        run: |
          import base64,json,os,pathlib,subprocess
          root=pathlib.Path('qa')
          for image in ('dashboard.png','discos.png','acerca-de.png'):
              choices=list(root.rglob(image))
              if not choices: raise RuntimeError('Falta captura '+image)
              target='docs/images/con-e-linux-'+image
              query=subprocess.run(['gh','api','repos/'+os.environ['GH_REPO']+'/contents/'+target],capture_output=True,text=True)
              body={'message':'Document Con-E Linux preview with simulated data','content':base64.b64encode(choices[0].read_bytes()).decode(),'branch':'main'}
              if query.returncode==0: body['sha']=json.loads(query.stdout)['sha']
              subprocess.run(['gh','api','--method','PUT','repos/'+os.environ['GH_REPO']+'/contents/'+target,'--input','-'],input=json.dumps(body),text=True,check=True,stdout=subprocess.DEVNULL)
